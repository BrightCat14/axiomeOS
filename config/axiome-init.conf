# axiome-init service definitions (parsed by /bin/init at boot)
# Fields: command, depends (comma/space separated), restart, maxfail, log

[syslog]
command=/bin/syslogd
depends=
restart=always
maxfail=0
log=/var/log/syslog.log

# Interactive console (getty-style): a shell on the serial TTY. restart=always
# means exiting the shell respawns a fresh prompt, like a real getty/login.
[console]
command=/bin/sh
depends=
restart=always
maxfail=0

