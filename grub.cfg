set timeout=3
set default=0

menuentry "axiomeOS" {
    insmod efi_gop
    insmod gfxterm
    terminal_output gfxterm
    set gfxmode=1024x768x32
    set gfxpayload=keep
    multiboot2 /boot/kernel.elf
    boot
}

menuentry "axiomeOS (verbose)" {
    insmod efi_gop
    insmod gfxterm
    terminal_output gfxterm
    set gfxmode=1024x768x32
    set gfxpayload=keep
    multiboot2 /boot/kernel.elf debug=1
    boot
}
