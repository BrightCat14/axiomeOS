# Meson cross file for axiomeOS userspace (template — edit paths).
# The axiome userspace ABI: x86_64, PIE, static crt0, dynamic libc.sl.
# Point `c` at the same x86_64-elf-gcc used by kernel/Makefile's USER_* rules.

[binaries]
c = '/home/brightcat/opt/cross/bin/x86_64-elf-gcc'
ar = '/home/brightcat/opt/cross/bin/x86_64-elf-ar'
strip = '/home/brightcat/opt/cross/bin/x86_64-elf-strip'
pkgconfig = 'pkg-config'

[host_machine]
system = 'axiome'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
c_args = ['-ffreestanding', '-nostdlib', '-nostartfiles', '-fno-builtin',
          '-fno-stack-protector', '-fPIC', '-mcmodel=small',
          '-mno-red-zone', '-O2']
c_link_args = ['-nostdlib', '-pie']
needs_exe_wrapper = true
